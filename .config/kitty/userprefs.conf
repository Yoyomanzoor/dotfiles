font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
enable_audio_bell no
font_size 15.0
window_padding_width 25
#background_opacity 0.60
#hide_window_decorations yes
#confirm_os_window_close 0

cursor_shape beam

enabled_layouts tall:bias=80;full_size=1;mirrored=false,fat:bias=70;full_size=1;mirrored=false


# Create a new window splitting the space used by the existing one so that
# the two windows are placed one above the other
# map f5 launch --location=hsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side
# map f6 launch --location=vsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side if the existing window is wide or
# one above the other if the existing window is tall.
map f4 launch --location=split

# Rotate the current split, changing its split axis from vertical to
# horizontal or vice versa
map f7 layout_action rotate

# Move the active window in the indicated direction
map alt+ctrl+up move_window up
map alt+ctrl+left move_window left
map alt+ctrl+right move_window right
map alt+ctrl+down move_window down

# Move the active window to the indicated screen edge
# map ctrl+shift+up layout_action move_to_screen_edge top
# map ctrl+shift+left layout_action move_to_screen_edge left
# map ctrl+shift+right layout_action move_to_screen_edge right
# map ctrl+shift+down layout_action move_to_screen_edge bottom

# Switch focus to the neighboring window in the indicated direction
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down

map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# fixing the things I broke
map alt+ctrl+shift+h show_scrollback
map f3 next_layout

# don't close on me
confirm_os_window_close 0
map ctrl+shift+w close_window_with_confirmation
