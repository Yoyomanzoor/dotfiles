[mgr]
show_hidden = true

[opener]
edit = [{ run = 'nvim -- %s', block = true, desc = "Neovim", for = "unix" }]
open = [{ run = 'wsl-open %s1', desc = "Windows default app", for = "unix" }]
pdf = [{ run = 'wsl-pdf %s1', orphan = true, desc = "Zathura (WSLg) / Windows PDF app", for = "unix" }]

[open]
rules = [
  { url = "*/", use = "edit" },
  { mime = "application/pdf", use = ["pdf", "open"] },
  { mime = "text/*", use = ["edit", "open"] },
  { mime = "application/json", use = ["edit", "open"] },
  { mime = "*/javascript", use = ["edit", "open"] },
  { mime = "*", use = ["open", "edit"] },
]
