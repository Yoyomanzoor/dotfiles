# Windows Terminal + Arch WSL. No TPM bootstrap is needed.
set -g default-shell /usr/bin/fish
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB'
set -g escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-clipboard on
set -g copy-command 'wsl-clipboard copy'
setw -g mode-keys vi
set -g status-keys vi

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
# F12 remains available if a Windows input method captures Ctrl+Space.
set -g prefix2 F12
bind F12 send-prefix -2
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'Reloaded tmux config'
bind Enter new-window -c '#{pane_current_path}'
unbind '"'
unbind %
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Space last-window
bind C-v copy-mode
bind C-p paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wsl-clipboard copy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wsl-clipboard copy'
bind -T copy-mode-vi Escape send-keys -X cancel
bind -n M-H resize-pane -L 10
bind -n M-J resize-pane -D 10
bind -n M-K resize-pane -U 10
bind -n M-L resize-pane -R 10
bind t run-shell 'fzf-sesh'
bind -n C-t run-shell 'fzf-sesh'
bind L run-shell 'sesh last'

# Match Neovim's nvim-tmux-navigation without a second navigation plugin.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?(g?vim|nvim)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\' 'select-pane -l'

set -g status-position top
set -g status-style 'bg=#191724,fg=#e0def4'
set -g pane-border-style 'fg=#403d52'
set -g pane-active-border-style 'fg=#c4a7e7'
set -g status-left '#[fg=#c4a7e7,bold] #S #[default]'
set -g status-right '#[fg=#9ccfd8]#{pane_current_command} #[fg=#e0def4]%I:%M %p '
setw -g window-status-current-style 'fg=#191724,bg=#c4a7e7,bold'
