# Personal project sessions can be added once those directories exist.
[default_session]
preview_command = "eza --all --group-directories-first --color=always {}"

[[session]]
name = "home"
path = "~"
startup_command = "fastfetch"
preview_command = "fastfetch"

[[session]]
name = "yazi"
path = "~"
startup_command = "yazi"

[[session]]
name = "nvim"
path = "~"
startup_command = "nvim-pick"

[[session]]
name = "downloads"
path = "~/Downloads"
startup_command = "yazi"

[[session]]
name = "nvim_config"
path = "~/.config/nvim"
startup_command = "nvim init.lua"
preview_command = "bat --color=always ~/.config/nvim/init.lua"

[[session]]
name = "tmux"
path = "~/.config/tmux"
startup_command = "nvim tmux.conf"

[[session]]
name = "sesh"
path = "~/.config/sesh"
startup_command = "nvim sesh.toml"
